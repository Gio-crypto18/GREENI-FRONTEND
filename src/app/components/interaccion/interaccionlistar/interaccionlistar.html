<div class="list-container">
  
  <section class="list-card mat-elevation-z8">
    
    <header class="list-header">
      
      <button mat-icon-button routerLink="/app/comunidad">
        <mat-icon>arrow_back</mat-icon>
      </button>

      <h2 class="list-title">Lista de Interacciones</h2>

      <div class="header-spacer"></div>
    </header>

    <div class="table-wrapper">
      
      <table mat-table [dataSource]="dataSource" class="data-table">

        <ng-container matColumnDef="a">
          <th mat-header-cell *matHeaderCellDef> No. </th>
          <td mat-cell *matCellDef="let element"> {{element.interaccion_id}} </td>
        </ng-container>

        <ng-container matColumnDef="b">
          <th mat-header-cell *matHeaderCellDef> Descripción </th>
          <td mat-cell *matCellDef="let element"> {{element.descripcion}} </td>
        </ng-container>

        <ng-container matColumnDef="d">
          <th mat-header-cell *matHeaderCellDef> Fecha </th>
          <td mat-cell *matCellDef="let element"> {{element.fecha_pub | date:'dd/MM/yyyy'}} </td>
        </ng-container>

        <ng-container matColumnDef="FK">
          <th mat-header-cell *matHeaderCellDef> Usuario </th>
          <td mat-cell *matCellDef="let element"> {{element.usuario.nombre}} </td>
        </ng-container>

        <ng-container matColumnDef="fk2">
          <th mat-header-cell *matHeaderCellDef> Tipo </th>
          <td mat-cell *matCellDef="let element"> {{element.tipointeraccion.nombre}} </td>
        </ng-container>

        <ng-container matColumnDef="j">
          <th mat-header-cell *matHeaderCellDef class="center-cell">Eliminar</th>
          <td mat-cell *matCellDef="let element" class="center-cell">
            
            <button mat-icon-button 
                    class="btn-delete"
                    (click)="eliminar(element.interaccion_id)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

    </div> <mat-paginator
      [pageSizeOptions]="[5, 10, 20]"
      [pageSize]="5"
      showFirstLastButtons
      aria-label="Paginación de Interacción"
    ></mat-paginator>
      
  </section> 
</div>

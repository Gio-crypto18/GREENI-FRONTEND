<div class="app-shell">
  <!-- SIDEBAR -->
  <aside class="app-sidebar">
    <div class="brand">
      <span class="logo-icon">🌿</span>
      <span class="logo-text">Greeni</span>
    </div>

    <nav class="menu">
      <a routerLink="/app/home" routerLinkActive="active" class="menu-item">
        <span>Home</span>
      </a>

      <a
        routerLink="/app/mis-plantas"
        routerLinkActive="active"
        class="menu-item"
      >
        <span>Mis plantas</span>
      </a>

      <a
        routerLink="/app/diagnostico"
        routerLinkActive="active"
        class="menu-item"
      >
        <span>Diagnóstico</span>
      </a>

      <a
        routerLink="/app/calendario"
        routerLinkActive="active"
        class="menu-item"
      >
        <span>Calendario</span>
      </a>

      <a routerLink="/app/guia" routerLinkActive="active" class="menu-item">
        <span>Mis Guías</span>
      </a>

      <a
        routerLink="/app/comunidad"
        routerLinkActive="active"
        class="menu-item"
      >
        <span>Comunidad</span>
      </a>

      <a routerLink="/app/perfil" routerLinkActive="active" class="menu-item">
        <span>Mi Perfil</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-summary">
        <div class="user-name">{{ userName }}</div>
        <div class="user-email">{{ userEmail }}</div>
      </div>
      <button class="logout-btn" (click)="logout()">Cerrar sesión</button>
    </div>
  </aside>

  <!-- CONTENIDO INTERNO -->
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>

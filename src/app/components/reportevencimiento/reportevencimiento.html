<div class="report-container">

  <div class="back-row">
    <button mat-icon-button (click)="volver()">
      <mat-icon>arrow_back</mat-icon>
    </button>

    <h2 class="report-title">Reporte de vencimiento</h2>
  </div>

  <div *ngIf="hasData; else sinDatos" class="chart-wrapper">
    <canvas
      baseChart
      [data]="barChartData"
      [options]="barChartOptions"
      [type]="barChartType"
      [legend]="barChartLegend">
    </canvas>


    <div class="legend-card">
      <h3>Detalle por vencimiento</h3>

      <ul>
        <li
          *ngFor="let label of (barChartData.labels || []); let i = index"
          class="legend-item"
        >
          <span
            class="legend-color"
            [style.background-color]="getColor(i)">
          </span>

          <span class="legend-label">{{ label }}</span>

          <span class="legend-value">
            {{ getValue(i) }} diagnósticos
          </span>
        </li>
      </ul>
    </div>
  </div>


  <ng-template #sinDatos>
    <div class="no-data-card">
      <mat-icon class="no-data-icon">info</mat-icon>
      <p class="no-data-text">No hay datos para mostrar.</p>
    </div>
  </ng-template>
</div>
